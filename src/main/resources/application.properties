spring.application.name=stockpulse-inventory
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=8080
server.error.include-exception=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

commerce.pricing.strategy=rule-based-pricing
commerce.reorder.strategy=rule-based-reorder

# AI strategy names available for runtime switching
# commerce.pricing.strategy=ai-pricing
# commerce.reorder.strategy=ai-reorder